# Signs in with the test login from the open sign-up sheet (developer menu on).
# TEST_EMAIL / TEST_PASSWORD come from the command line (-e), never from a file in git.
appId: ${APP_ID || 'com.outfitly.app'}
---
- assertVisible:
    id: dev-sign-in
- tapOn:
    id: dev-email
- inputText: ${TEST_EMAIL}
- tapOn:
    id: dev-password
- inputText: ${TEST_PASSWORD}
# No hideKeyboard: with the simulator's hardware keyboard there is none to hide (and it fails).
# The button sits above where the on-screen keyboard would be.
- tapOn:
    id: dev-sign-in-submit
# The CAPTCHA and the sign-in take a few seconds; the sheet closes when done.
- extendedWaitUntil:
    notVisible:
      id: sign-up-sheet
    timeout: 30000
# iOS may offer to store the password afterwards; that dialog covers the tabs.
- tapOn:
    text: 'Not Now'
    optional: true
