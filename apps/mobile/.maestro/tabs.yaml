# Every tab opens its screen, and Home comes back. Uses ids, so any phone language works.
# Install a preview build (`eas build --profile preview`), then:
#   maestro test apps/mobile/.maestro/tabs.yaml
# A Release build of the development app:
#   maestro test -e APP_ID=com.outfitly.app.dev apps/mobile/.maestro/tabs.yaml
appId: ${APP_ID || 'com.outfitly.app'}
---
- launchApp
- runFlow: subflows/skip-taste.yaml
- assertVisible:
    id: screen-home
- tapOn:
    id: tab-search
- assertVisible:
    id: screen-search
- tapOn:
    id: tab-create
- assertVisible:
    id: screen-create
- tapOn:
    id: tab-saved
- assertVisible:
    id: screen-saved
- tapOn:
    id: tab-profile
- assertVisible:
    id: screen-profile
- tapOn:
    id: tab-home
- assertVisible:
    id: screen-home
