# Following someone fills the Following tab: sign in with the test login, find a poster through
# search's people suggestions, open their profile (counts, looks), Follow, and Home → Following
# shows their looks. Ends by unfollowing them again (synced), so the next run starts the same.
#   maestro test -e APP_ID=com.outfitly.app.dev -e TEST_EMAIL=… -e TEST_PASSWORD=… \
#     apps/mobile/.maestro/follow-fills-following.yaml
# POSTER: what to type to find the poster (default outfitly, for @outfitly.picks).
appId: ${APP_ID || 'com.outfitly.app'}
---
- launchApp:
    clearState: true
- runFlow: subflows/skip-taste.yaml
- tapOn:
    id: tab-profile
- longPressOn:
    id: profile-title
- assertVisible:
    id: dev-menu
- tapOn:
    id: profile-sign-in
- runFlow: subflows/test-login.yaml

# Following is empty to begin with (the test login follows nobody), and stays open on Home.
- tapOn:
    id: tab-home
- tapOn:
    id: feed-switch-following
- extendedWaitUntil:
    visible:
      id: following-empty
    timeout: 20000

# Find the poster and open their profile.
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
- inputText: ${POSTER || 'outfitly'}
- extendedWaitUntil:
    visible:
      id: search-person
    timeout: 10000
- tapOn:
    id: search-person
    index: 0
- extendedWaitUntil:
    visible:
      id: profile-header
    timeout: 10000
- assertVisible:
    id: profile-count-followers
- extendedWaitUntil:
    visible:
      id: profile-card
    timeout: 10000

# An earlier run that stopped halfway may have left the follow on: undo it first.
# (Follow / Following is the button's "selected" state, as VoiceOver reads it.)
- runFlow:
    when:
      visible:
        id: profile-follow
        selected: true
    commands:
      - tapOn:
          id: profile-follow
      - assertVisible:
          id: profile-follow
          selected: false
- tapOn:
    id: profile-follow
- assertVisible:
    id: profile-follow
    selected: true
- takeScreenshot: follow/profile-following
- tapOn:
    id: profile-back
- runFlow: subflows/wait-synced.yaml

# Back on Home, the Following list that was empty now shows their looks (no pull to refresh).
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: feed-card
      childOf:
        id: feed-following
    timeout: 20000
- takeScreenshot: follow/following-feed

# Clean up: unfollow again and wait until the server has it.
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
- tapOn:
    id: search-clear
- inputText: ${POSTER || 'outfitly'}
- extendedWaitUntil:
    visible:
      id: search-person
    timeout: 10000
- tapOn:
    id: search-person
    index: 0
- extendedWaitUntil:
    visible:
      id: profile-follow
      selected: true
    timeout: 10000
- tapOn:
    id: profile-follow
- assertVisible:
    id: profile-follow
    selected: false
- tapOn:
    id: profile-back
- runFlow: subflows/wait-synced.yaml
