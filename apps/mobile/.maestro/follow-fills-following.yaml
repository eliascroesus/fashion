# Following someone fills the Following tab: sign in with the test login (Following is empty),
# search, open a look, tap its poster for their profile (counts, looks), Follow, and Home → Following
# shows their looks. Ends by unfollowing them again through search's people suggestions
# (synced), so the next run starts the same; a run that stopped halfway is undone at the start.
#   maestro test -e APP_ID=com.outfitly.app.dev -e TEST_EMAIL=… -e TEST_PASSWORD=… \
#     apps/mobile/.maestro/follow-fills-following.yaml
# POSTER: what to type to find the poster again (default outfitly, for @outfitly.picks, the only
# poster on staging).
appId: ${APP_ID || 'com.outfitly.app'}
---
- launchApp:
    clearState: true
- runFlow: subflows/skip-taste.yaml
- tapOn:
    id: tab-profile
- longPressOn:
    id: profile-title
- assertVisible:
    id: dev-menu
- tapOn:
    id: profile-sign-in
- runFlow: subflows/test-login.yaml

# Following is empty to begin with (the test login follows nobody), and stays open on Home.
# A run that stopped halfway may have left the follow on: undo it first.
- tapOn:
    id: tab-home
- tapOn:
    id: feed-switch-following
- extendedWaitUntil:
    visible:
      id: 'following-empty|feed-card'
      childOf:
        id: feed-following
    timeout: 20000
- runFlow:
    when:
      notVisible:
        id: following-empty
    file: subflows/unfollow-poster.yaml
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: following-empty
    timeout: 20000

# Open a look from search results and tap its poster for their profile (Home's Following
# stays open). Search, not For You: the test login has seen most looks, so For You may be empty.
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
- inputText: ${LOOK_SEARCH || 'minimal'}
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: search-card
    timeout: 20000
- tapOn:
    id: search-card
    index: 0
- extendedWaitUntil:
    visible:
      id: look-author-open
    timeout: 10000
- tapOn:
    id: look-author-open
- extendedWaitUntil:
    visible:
      id: profile-header
    timeout: 10000
- assertVisible:
    id: profile-count-followers
- extendedWaitUntil:
    visible:
      id: profile-card
    timeout: 10000

# Follow / Following is the button's "selected" state, as VoiceOver reads it.
- assertVisible:
    id: profile-follow
    selected: false
- tapOn:
    id: profile-follow
- assertVisible:
    id: profile-follow
    selected: true
- takeScreenshot: follow/profile-following
- tapOn:
    id: profile-back
- tapOn:
    id: look-back
- runFlow: subflows/wait-synced.yaml

# The Following list that was empty now shows their looks (no pull to refresh).
- tapOn:
    id: tab-home
- tapOn:
    id: feed-switch-following
- extendedWaitUntil:
    visible:
      id: feed-card
      childOf:
        id: feed-following
    timeout: 20000
- takeScreenshot: follow/following-feed

# Clean up: unfollow again and wait until the server has it.
- runFlow: subflows/unfollow-poster.yaml
