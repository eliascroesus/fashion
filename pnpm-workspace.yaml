packages:
  - apps/*
  - packages/*

# Dependency install scripts are off unless listed here.
allowBuilds:
  # Downloads the sentry-cli binary that uploads app source maps during EAS builds.
  '@sentry/cli': true
  # Ships prebuilt binaries as optional deps; its postinstall check isn't needed.
  esbuild: false

# One version of each shared dev tool across every workspace.
catalog:
  # Stay on 6.0.x: typescript-eslint supports TS <6.1, and TS 7 (native) drops the JS compiler API.
  typescript: ~6.0.3
  vitest: ^5.0.5
