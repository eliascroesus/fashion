name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main gets its own full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same major version and extensions as Supabase. Tests create their own databases here.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Schema and migrations are in sync
        # drizzle-kit exits 0 even when it needs an interactive answer (renames),
        # so require its explicit "nothing to migrate" message as well.
        run: |
          pnpm db:generate 2>&1 | tee "$RUNNER_TEMP/generate.log"
          grep -q "No schema changes, nothing to migrate" "$RUNNER_TEMP/generate.log"
          git add --intent-to-add packages/db/migrations
          git diff --exit-code packages/db/migrations

  api-image:
    name: API image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -f apps/api/Dockerfile -t outfitly-api .
      - name: Give the database the Supabase parts our migrations expect
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;
            CREATE SCHEMA auth; CREATE TABLE auth.users (id uuid PRIMARY KEY);"
      - name: Release command (migrations) runs inside the image
        run: docker run --rm --network host -e DATABASE_URL outfitly-api node /app/packages/db/scripts/migrate.ts
      - name: Server starts, answers health, refuses logged-out requests, runs the test job
        run: |
          docker run -d --name api --network host -e DATABASE_URL \
            -e SUPABASE_URL=https://example.supabase.co \
            -e R2_ACCOUNT_ID=ci -e R2_ACCESS_KEY_ID=ci -e R2_SECRET_ACCESS_KEY=ci \
            -e R2_ORIGINALS_BUCKET=ci-originals -e R2_PUBLIC_BUCKET=ci-public \
            -e MEDIA_PUBLIC_BASE_URL=https://img.example.com outfitly-api
          for i in $(seq 1 30); do curl -sf localhost:8080/v1/health && break; sleep 1; done
          curl -sf localhost:8080/v1/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/me)" = 401
          for i in $(seq 1 20); do docker logs api 2>&1 | grep -q 'ping job ran' && break; sleep 1; done
          docker logs api 2>&1 | grep -q 'ping job ran'
      - name: The image turns the 12 MP iPhone HEIC into 3 sizes (sharp + libheif in a worker)
        run: |
          docker run --rm -v "$PWD/apps/api/test/fixtures:/fixtures:ro" -w /app/apps/api outfitly-api \
            node --input-type=module -e "
              import { readFileSync } from 'node:fs';
              import { processImageIsolated } from './src/media/process-isolated.ts';
              const t = performance.now();
              const r = await processImageIsolated(readFileSync('/fixtures/iphone-12mp-gps.heic'));
              console.log('sizes', r.variants.map((v) => v.width).join('/'), 'in', Math.round(performance.now() - t), 'ms');
              if (r.variants.length !== 3) process.exit(1);"
      - if: failure()
        run: docker logs api || true

  mobile-bundle:
    name: App bundles build (iOS + Android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @outfitly/mobile bundle
        env:
          CI: '1'
